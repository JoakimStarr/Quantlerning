name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  content-check:
    name: 内容校验 + 沙箱重放
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install python-frontmatter pyyaml numpy matplotlib
      - name: 内容静态检查 + 纯数学沙箱重放
        run: python scripts/check_content.py
      - name: pytest（phase_loader 边界用例）
        run: |
          pip install pytest
          python -m pytest backend/tests -q

  frontend:
    name: 前端类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: vue-tsc
        working-directory: frontend
        run: npx vue-tsc --noEmit

  sandbox-db:
    name: 行情沙箱实测（连库）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quantlab
          POSTGRES_PASSWORD: quantlab
          POSTGRES_DB: quantlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install asyncpg pandas numpy matplotlib
      - name: 导入最小数据集
        run: |
          gunzip -c data/quantlerning_sample.sql.gz | \
            PGPASSWORD=quantlab psql -h localhost -U quantlab -d quantlab -v ON_ERROR_STOP=1
      - name: 运行依赖行情库的沙箱断言
        env:
          QL_DB_URL: postgresql://quantlab:quantlab@localhost:5432/quantlab
        run: python scripts/check_sandbox_db.py
